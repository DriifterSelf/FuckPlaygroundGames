name: Build and Package Proxy

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build amd_ags_x64.dll (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Proxy DLL
        run: cmake --build build --config Release

      - name: Prepare Release Package
        run: |
          mkdir package
          copy build\Release\amd_ags_x64.dll package\
          copy README.md package\
          copy LICENSE package\
          if (Test-Path rdna4_ags_proxy.ini) { copy rdna4_ags_proxy.ini package\ }
        shell: powershell

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FuckPlaygroundGames-amd_ags_x64
          path: package/*
          if-no-files-found: error

      - name: Create Release Archive (ZIP)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: |
          Compress-Archive -Path package/* -DestinationPath FuckPlaygroundGames-Release.zip
        shell: powershell

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            FuckPlaygroundGames-Release.zip
            package/amd_ags_x64.dll
          draft: false
          prerelease: false
          generate_release_notes: true
